name: Codependency live smoke and negative E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/codependencia-ui-hotfix-v1.css'
      - 'assets/codependencia-results-v1.js'
      - 'assets/codependencia-results-v1.css'
      - 'assets/codependencia-cats-bridge-v1.js'
      - 'assets/codependencia-persistence-config-v1.js'
      - 'tests/codependencia-live-smoke.mjs'
      - '.github/workflows/codependencia-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - run: |
          which google-chrome
          (cd .. && python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/codep-http.log 2>&1) &
          CODEP_SMOKE_URL="http://127.0.0.1:8123/Escala-de-Co-Depenpencia-Emocional/" CHROMIUM_PATH="$(which google-chrome)" node tests/codependencia-live-smoke.mjs
