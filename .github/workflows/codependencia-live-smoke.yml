name: Codependency live smoke and negative E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/codependencia-live-smoke.mjs'
      - '.github/workflows/codependencia-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - run: |
          which google-chrome
          CHROMIUM_PATH="$(which google-chrome)" node tests/codependencia-live-smoke.mjs
