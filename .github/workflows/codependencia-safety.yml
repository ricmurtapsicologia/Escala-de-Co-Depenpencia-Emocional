name: Codependency clinical safety
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', 'tests/**', '.github/workflows/codependencia-safety.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/codependencia-safety.test.mjs
