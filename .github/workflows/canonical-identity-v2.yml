name: Canonical Identity v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-identity-v2.yml'

permissions:
  contents: write

env:
  CANONICAL_IDENTITY_VERSION: '2.0.0'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical identity fields safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='\t\t\t<!-- Seção de Dependência Emocional (Perguntas 1 a 20) -->'
          if marker not in s:
              raise SystemExit('QUESTION_MARKER_MISSING')
          before, protected=s.split(marker,1)
          original_protected=protected
          if 'id="birthDate"' not in before:
              needle='''\t\t\t\t<input type="text" id="age" placeholder="Idade">\n\t\t\t\t<input type="date" id="date" placeholder="Data de realização do teste" required>'''
              replacement='''\t\t\t\t<input type="text" id="age" placeholder="Idade">\n\t\t\t\t<input type="date" id="birthDate" name="birthDate" aria-label="Data de nascimento" required>\n\t\t\t\t<input type="date" id="date" placeholder="Data de aplicação do rastreio" aria-label="Data de aplicação do rastreio" required>'''
              if needle not in before:
                  raise SystemExit('IDENTITY_BLOCK_NOT_FOUND')
              before=before.replace(needle,replacement,1)
          out=before+marker+protected
          if out.split(marker,1)[1] != original_protected:
              raise SystemExit('QUESTION_AND_LOGIC_CHANGED')
          p.write_text(out,encoding='utf-8')
          PY
      - name: Validate canonical identity
        shell: bash
        run: |
          grep -q 'id="fullName"' index.html
          grep -q 'id="birthDate"' index.html
          grep -q 'id="date"' index.html
          grep -q 'Data de aplicação do rastreio' index.html
          grep -q 'Perguntas 1 a 20' index.html
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona identificação canônica à escala de Codependência'
          git push
