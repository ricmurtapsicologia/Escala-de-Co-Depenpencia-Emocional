name: Codependencia FIVE full E2E cycles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codependencia-five-pass-e2e.yml'
      - 'tests/codependencia-five-pass-e2e.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-profiles:
    name: E2E ${{ matrix.case }} — desktop + mobile + negative receipt
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: [minimum, maximum, neutral, split, alternating]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Validate static clinical contract / QA
        run: |
          node tests/codependencia-results.test.mjs
          node tests/codependencia-insights.test.mjs
          python3 scripts/qa-codependencia.py | tail -n 2
      - name: Live public site; intercept 43-field Forms POST and verifier acknowledgement
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CODEP_E2E_PROFILE: ${{ matrix.case }}
        run: node tests/codependencia-five-pass-e2e.mjs
      - name: Check failed persistence cannot produce results or duplicate clinical submissions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CODEP_SMOKE_URL: http://127.0.0.1:8123/Escala-de-Co-Depenpencia-Emocional/
        run: |
          (cd .. && python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/codep-negative.log 2>&1) &
          node tests/codependencia-negative-e2e.mjs
      - name: Run summary
        if: success()
        run: echo "E2E_CYCLE_PASS=${{ matrix.case }} devices=desktop,mobile positive_submissions_intercepted=2 negative_cases=1 real_Google_Form_writes=0"
