name: Minimize Identity v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/minimize-identity-v1.py'
      - '.github/workflows/minimize-identity-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minimize legacy identity
        run: python scripts/minimize-identity-v1.py
      - name: Commit protected migration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Minimiza dados pessoais na identificação da escala"
          git push
