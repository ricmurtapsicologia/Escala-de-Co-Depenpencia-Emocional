name: Clinical verifier live GET and browser CORS preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/codep-verifier-live-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Read-only verifier and browser compatibility
        env:
          VERIFY_URL: https://script.google.com/macros/s/AKfycbwnMJkbCxBSQMiwDfB9wOMxEyzQqQdEQtC9nrgovxSa3n-AWiF_RzcqdxkH_3sKt7Y/exec
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          url=os.environ['VERIFY_URL']
          try:
            with urllib.request.urlopen(url,timeout=25) as resp:
              raw=resp.read(12000)
              print('BACKEND_HTTP='+str(resp.status))
              try:
                obj=json.loads(raw)
                print('BACKEND_READINESS='+json.dumps({k:obj.get(k) for k in ('status','configured','protocol','version')}))
              except Exception as e:
                print('BACKEND_IS_JSON=false')
                print('BACKEND_BODY_TYPE='+('HTML' if raw.lstrip().startswith(b'<') else 'OTHER'))
          except Exception as e: print('BACKEND_READ_ERROR='+str(e)[:400])
          PY
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          page.on('console',msg=>{if(msg.type()==='error')console.log('BROWSER_CONSOLE_ERROR='+msg.text().slice(0,260))});
          try{
            await page.goto('https://ricmurtapsicologia.github.io/Escala-de-Co-Depenpencia-Emocional/',{waitUntil:'domcontentloaded',timeout:40000});
            const status=await page.evaluate(async url=>{
              const abort=new AbortController();
              const kill=setTimeout(()=>abort.abort(),13000);
              try {
                const resp=await fetch(url,{method:'GET',cache:'no-store',credentials:'omit',signal:abort.signal});
                let json=null;try{json=await resp.json()}catch(e){}
                return {readable:true,http:resp.status,success:resp.ok,configured:json?.configured===true,protocol:json?.protocol||null,status:json?.status||null}
              }catch(e){return {readable:false,error:String(e).slice(0,240)}}finally{clearTimeout(kill)}
            },process.env.VERIFY_URL);
            console.log('BROWSER_FETCH_RESULT='+JSON.stringify(status));
            await page.waitForFunction(()=>document.documentElement.dataset.codepVerifiedCollector==='true',null,{timeout:20000});
            const ui=await page.evaluate(()=>({
              active:document.documentElement.dataset.codepVerifiedCollector==='true',
              visibleForm:!!document.querySelector('#scaleForm')?.getClientRects().length,
              nativeFrameHidden:!document.querySelector('#rm-native-google-form')?.getClientRects().length,
              questions:document.querySelectorAll('#scaleForm select[name^="q"]').length,
              submitInitiallyDisabled:document.querySelector('#screening-submit')?.disabled===true,
              fallbackLink:document.querySelector('#rm-canonical-form-link')?.href?.startsWith('https://docs.google.com/forms/'),
              fallbackHidden:document.querySelector('#rm-official-fallback-hint')?.hidden===true && !document.querySelector('#rm-canonical-form-link')?.getClientRects().length,
              resultInitiallyHidden:document.querySelector('#codep-results')?.hidden===true
            }));
            console.log('LIVE_SITE_ACTIVATION='+JSON.stringify(ui));
            const probe=await page.evaluate(async url=>{
              const abort=new AbortController();
              const kill=setTimeout(()=>abort.abort(),18000);
              try{
                const resp=await fetch(url,{
                  method:'POST',credentials:'omit',cache:'no-store',redirect:'follow',signal:abort.signal,
                  headers:{'Content-Type':'text/plain;charset=UTF-8'},
                  body:JSON.stringify({protocol:'codependencia-persistence-v1',fingerprint:'0'.repeat(64)})
                });
                const data=await resp.json();
                return {readable:true,http:resp.status,persisted:data.persisted===true,
                  reason:data.reason||null};
              }catch(e){return {readable:false,error:String(e).slice(0,180)}}finally{clearTimeout(kill)}
            },process.env.VERIFY_URL);
            console.log('BROWSER_POST_NEGATIVE_PROBE='+JSON.stringify(probe));
            if(!probe.readable||probe.http!==200||probe.persisted||probe.reason!=='not-yet-visible')
              throw Error('CROSS_ORIGIN_NEGATIVE_PERSISTENCE_PROBE_FAILED');
            if(!ui.active||!ui.visibleForm||!ui.nativeFrameHidden||ui.questions!==40||!ui.submitInitiallyDisabled||!ui.fallbackLink||!ui.fallbackHidden||!ui.resultInitiallyHidden)throw Error('PUBLIC_SITE_VERIFIER_ACTIVATION_FAILED');
          }finally{await browser.close()}
          JS
