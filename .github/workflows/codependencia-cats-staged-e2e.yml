name: Codependencia staged CATS persistence E2E
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/codependencia-experience-v3.js'
      - 'assets/codependencia-experience-v3.css'
      - 'assets/codependencia-ui-hotfix-v1.css'
      - 'assets/codependencia-cats-bridge-v1.js'
      - 'assets/codependencia-persistence-config-v1.js'
      - 'assets/codependencia-results-v1.js'
      - 'assets/codependencia-insights-v4.js'
      - 'assets/codependencia-results-v1.css'
      - 'tests/codependencia-results.test.mjs'
      - 'tests/codependencia-insights.test.mjs'
      - 'tests/codependencia-negative-e2e.mjs'
      - 'scripts/qa-codependencia.py'
      - 'tests/codependencia-cats-staged-e2e.mjs'
      - '.github/workflows/codependencia-cats-staged-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - run: node tests/codependencia-results.test.mjs
      - run: node tests/codependencia-insights.test.mjs
      - run: python3 scripts/qa-codependencia.py
      - run: |
          (cd .. && python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/codep-http.log 2>&1) &
          CODEP_SMOKE_URL="http://127.0.0.1:8123/Escala-de-Co-Depenpencia-Emocional/" CHROMIUM_PATH="$(which google-chrome)" node tests/codependencia-cats-staged-e2e.mjs
          CODEP_SMOKE_URL="http://127.0.0.1:8123/Escala-de-Co-Depenpencia-Emocional/" CHROMIUM_PATH="$(which google-chrome)" node tests/codependencia-negative-e2e.mjs
